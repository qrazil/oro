[package]
name = "oro-lang"
version = "0.2.0"
edition = "2021"
description = "The Oro programming language (Python-inspired, Rust implementation, bytecode VM)."
license = "MIT OR Apache-2.0"

# Deliberate: pin the 2021 edition. We prioritise edition stability over
# chasing the latest edition's features for a long-lived language runtime.

[[bin]]
name = "oro"
path = "src/main.rs"

[lib]
name = "oro_lang"
path = "src/lib.rs"

# Minimal and steady library imports on the Rust side — the policy is in the
# README, and the short form is that a dependency is taken for a problem that is
# hard, never one that is merely tedious, and only where the crate is stable
# enough that importing it is not a commitment to track someone else's churn.
#
# `regex` backs the `re` module: a Thompson-NFA engine with a guaranteed
# linear-time match (no ReDoS). A correct linear-time engine is a serious
# project and a hand-rolled backtracker can hang on inputs like (a+)+b.
#
# `mio` backs the I/O reactor (docs/stdlib-server-design.md §3). std has no
# epoll/kqueue API at all, so readiness notification — "tell me when this fd is
# readable" — cannot be written in pure std without `unsafe` and a hand-rolled
# syscall layer, and this crate has no `unsafe` in it. mio is the same
# epoll/kqueue wrapper tokio is built on, with the async runtime taken off the
# top: Oro is its own scheduler (the ready queue holds `Rc`-shaped tasks and can
# never be `Send`), so a runtime is the one thing it must not import. Three
# crates — `mio`, `libc`, `log` — against tokio's eight.
#
# `libc` is a *bindings* crate, declarations rather than an implementation, so
# the static-musl release gate survives it. That is checked, not assumed.
#
# `libc` is now a *direct* dependency as well as mio's, and that promotion adds
# nothing to the build: it is the same `libc 0.2` crate, already compiled, and
# `cargo tree` gains a line rather than a node. It is direct because
# `net.listen(addr, reuseport=true)` needs `setsockopt(2)` **before** `bind(2)`,
# and there is no way to reach that point from std — `TcpListener::bind` creates,
# configures and binds the socket inside one call and exposes no hook (checked
# against the std source, not assumed; see `src/net/reuseport.rs`). That is the
# one place in this crate where the alternative to four documented syscalls is a
# new dependency (`socket2`) bought for tedium rather than difficulty, which the
# README's policy declines. The cost is paid instead in `unsafe`, confined to
# `src/net/reuseport.rs` by a crate-level `#![deny(unsafe_code)]` that exactly one
# module opts out of.
[dependencies]
regex = "1"
mio = { version = "1", features = ["os-poll", "net"] }
libc = "0.2"

# Release build for the distributed single binary.
#
# opt-level = 3, not "s". This was `"s"`, on the theory that size optimisation
# "keeps the interpreter reasonably fast". Measured, it does not: an interpreter
# is one enormous dispatch loop, and `"s"` is exactly the setting that declines
# to inline the operand-stack helpers into it. Level 3 is worth 15-25% across
# the benchmark suite (see bench/RESULTS.md) for ~470 KB of binary — a trade a
# language runtime should take every time.
#
# panic = "abort" is safe here: Oro's exceptions are VM-level values, not Rust
# panics, and nothing in the crate relies on unwinding (no catch_unwind, no
# should_panic). It shaves the unwind tables. Cargo ignores the `panic` setting
# when it builds test harnesses, so `cargo test --release` works normally.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
