# Release workflow: cross-compiles the `oro` binary for Linux (musl, fully
# static) and macOS (x86_64 + arm64), then attaches the archives and a combined
# SHA256SUMS to the GitHub release for the pushed tag.
#
# ─────────────────────────────────────────────────────────────────────────────
# SUBSTITUTIONS: none. This file uses the ${{ github.* }} context, so it works
# unchanged in whatever repo it lives in. The only knob is BIN_NAME below.
# ─────────────────────────────────────────────────────────────────────────────
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # needed to create the release and upload assets

env:
  BIN_NAME: oro

jobs:
  # The full CI gate (cargo test, clippy, fmt, corpus, oro lint/fmt, the oracle
  # check, doc conformance) run on the tagged commit. `build` needs it, so a
  # commit that fails any gate cannot be built or shipped.
  gate:
    uses: ./.github/workflows/ci.yml

  build:
    name: build ${{ matrix.target }}
    needs: gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux is musl, not glibc: a fully static binary with no libc
          # dependency, so it runs on Alpine and old distros alike. This is only
          # possible because the whole dependency tree (regex + aho-corasick +
          # memchr + regex-automata + regex-syntax) is pure Rust — no C, no -sys
          # crates, no build scripts.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          # macOS builds natively (Apple's linker handles either arch); no cross.
          - target: x86_64-apple-darwin
            os: macos-13 # Intel runner
            cross: false
          - target: aarch64-apple-darwin
            os: macos-14 # Apple-silicon runner
            cross: false
    steps:
      - uses: actions/checkout@v4

      # Pinned to match rust-toolchain.toml and the CI gate, so the shipped
      # binary is built with the same toolchain everything else is verified on.
      - name: Install Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup target add ${{ matrix.target }} --toolchain 1.97.1

      # `cross` builds the musl targets in a container with the right linker,
      # which "just works" for a pure-Rust crate on both x86_64 and aarch64.
      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build (cross, musl)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Build (native, macOS)
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }}

      # The release profile already sets strip = true; this is a belt-and-braces
      # check that the artifact is stripped and reports its size.
      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME}"
          bin="target/${{ matrix.target }}/release/${BIN_NAME}"
          ls -l "$bin"
          echo "size: $(wc -c < "$bin") bytes"

          # The static-musl release gate. If a future dependency pulls in a C or
          # `-sys` crate and re-links libc, this fails the release rather than
          # shipping the glibc-dynamic binary the musl target exists to prevent.
          #
          # The gate is the ELF structure, NOT a tool's prose. `file`'s wording
          # varies by version and platform — modern Rust musl links static-pie,
          # which `file` calls "static-pie linked", not "statically linked", and
          # asserting on that string is how this broke. What actually defines
          # "no libc dependency" is: no PT_INTERP program header (no dynamic
          # loader) and no DT_NEEDED dynamic entries (no shared libraries). A
          # static-pie binary still has a *dynamic section* for its own
          # relocations, so the test is NEEDED-count, not section presence.
          # readelf reads the ELF the same on any runner and works cross-arch, so
          # the aarch64 artifact is verified on the x86_64 host too. `file` stays
          # as a logged signal, never the thing that fails the build.
          case "${{ matrix.target }}" in
            *-linux-musl)
              file -b "$bin" 2>/dev/null | sed 's/^/file: /' || true
              # `readelf` itself failing is a real error; capture it explicitly.
              headers=$(readelf -l "$bin") || { echo "::error::readelf -l failed on $bin" >&2; exit 1; }
              # `grep -c` EXITS 1 on zero matches, and a correctly static binary
              # has zero INTERP/NEEDED — so under `set -e -o pipefail` (the shell
              # GitHub runs) an unguarded `n=$(… | grep -c …)` kills the step
              # SILENTLY exactly when it should pass. `|| true` makes the *count*,
              # not grep's exit status, the thing the gate tests.
              interp=$(printf '%s\n' "$headers" | grep -c 'INTERP' || true)
              needed=$(readelf -d "$bin" 2>/dev/null | grep -c 'NEEDED' || true)
              echo "linkage: PT_INTERP=$interp DT_NEEDED=$needed"
              if [ "$interp" -ne 0 ]; then
                echo "::error::$bin has a PT_INTERP header ($interp) — it needs a dynamic loader; not static" >&2
                exit 1
              fi
              if [ "$needed" -ne 0 ]; then
                echo "::error::$bin has $needed DT_NEEDED entries — it depends on shared libraries; not static" >&2
                exit 1
              fi
              ;;
          esac
          stage="${BIN_NAME}-${version}-${{ matrix.target }}"
          mkdir "$stage"
          cp "$bin" "$stage/${BIN_NAME}"
          tar -czf "${stage}.tar.gz" "$stage"
          # Portable sha256 (Linux: sha256sum, macOS: shasum -a 256).
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${stage}.tar.gz" > "${stage}.tar.gz.sha256"
          else
            shasum -a 256 "${stage}.tar.gz" > "${stage}.tar.gz.sha256"
          fi
          cat "${stage}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ env.BIN_NAME }}-*.tar.gz
            ${{ env.BIN_NAME }}-*.tar.gz.sha256

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Assemble SHA256SUMS
        working-directory: dist
        run: |
          # One combined checksum file over every archive.
          cat ./*.tar.gz.sha256 | sed 's# .*/# #' > SHA256SUMS
          echo "---- SHA256SUMS ----"
          cat SHA256SUMS

      - name: Create GitHub release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            ./*.tar.gz SHA256SUMS
